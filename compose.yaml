services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ai-troubleshooting
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  ai-troubleshooter:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-jenkins-troubleshooter:compose
    container_name: ai-jenkins-troubleshooter
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: qwen2.5-coder:3b
      MAX_LOG_LENGTH: "12000"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai-troubleshooting

networks:
  ai-troubleshooting:
    external: true

volumes:
  ollama-data:
    external: true